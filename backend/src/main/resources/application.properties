# =============================================================
#  Food Delivery App — Spring Boot 3 Configuration
# =============================================================

# -------------------------------------------------------------
# Application
# -------------------------------------------------------------
spring.application.name=food-delivery-backend
server.port=8080
server.servlet.context-path=/api

# -------------------------------------------------------------
# MySQL DataSource
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_db\
  ?useSSL=false\
  &serverTimezone=UTC\
  &allowPublicKeyRetrieval=true\
  &characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Toujar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP — default in Spring Boot 3)
spring.datasource.hikari.pool-name=FoodDeliveryPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------
# validate  — DB must already match entities  (use in prod)
# update    — Hibernate alters schema to match entities (use in dev)
# create    — Drops and recreates schema on startup
# none      — Do nothing
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# JWT
# -------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------
# Jackson
# -------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# -------------------------------------------------------------
# Springdoc / Swagger UI
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# -------------------------------------------------------------
# Active Profile
# -------------------------------------------------------------
spring.profiles.active=dev
