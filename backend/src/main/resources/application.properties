# =============================================================
# Food Delivery App — Spring Boot 3
# Common Configuration
# =============================================================

# -------------------------------------------------------------
# Application
# -------------------------------------------------------------
spring.application.name=food-delivery-backend

# Render provides PORT automatically.
# Local development falls back to 8080.
server.port=${PORT:8080}

server.servlet.context-path=/api


# =============================================================
# Razorpay Payment Gateway
# =============================================================

razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}


# =============================================================
# MySQL DataSource
# =============================================================

# Local:
#   DB_HOST=localhost
#   DB_PORT=3306
#   DB_NAME=food_delivery_db
#
# Production:
#   DB_HOST=<Aiven host>
#   DB_PORT=10920
#   DB_NAME=defaultdb
#   DB_SSL_MODE=REQUIRED

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_delivery_db}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# -------------------------------------------------------------
# HikariCP Connection Pool
# -------------------------------------------------------------

spring.datasource.hikari.pool-name=FoodDeliveryPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000


# =============================================================
# JPA / Hibernate
# =============================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false


# =============================================================
# SQL Initialization
# =============================================================

# Database is already created/seeded.
spring.sql.init.mode=never


# =============================================================
# Redis — Spring Data Redis + Spring Cache
# =============================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis password is optional depending on your Redis provider.
# Render Key Value can be configured separately if authentication
# is enabled.
spring.data.redis.password=${REDIS_PASSWORD:}

# Use Redis as Spring's CacheManager.
spring.cache.type=redis

# Default TTL
spring.cache.redis.time-to-live=PT10M

# Readable cache keys
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=zwigato:


# =============================================================
# Email — Gmail SMTP
# =============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Never enable SMTP debug in production.
spring.mail.properties.mail.debug=false


# =============================================================
# OTP
# =============================================================

app.otp.expiry-minutes=10
app.otp.length=6


# =============================================================
# Frontend URL
# =============================================================

# Local:
# http://localhost:5173
#
# Production:
# https://your-frontend.vercel.app

app.frontend.url=${FRONTEND_URL:http://localhost:5173}


# =============================================================
# Invoice / Receipt Generation
# =============================================================

invoice.storage.path=/invoices
app.name=Tap Food Delivery


# =============================================================
# JWT
# =============================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}


# =============================================================
# Logging
# =============================================================

logging.level.com.fooddelivery=INFO

logging.level.org.springframework.security=WARN

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

logging.level.com.zaxxer.hikari=WARN

logging.level.org.springframework.web=WARN

logging.level.root=INFO


# =============================================================
# Jackson
# =============================================================

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.time-zone=UTC

spring.jackson.default-property-inclusion=non_null


# =============================================================
# SpringDoc / Swagger UI
# =============================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.disable-swagger-default-url=true


# =============================================================
# Active Profile
# =============================================================

# Local default = dev
# Render will set SPRING_PROFILES_ACTIVE=prod

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}