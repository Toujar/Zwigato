# =============================================================
#  Food Delivery App — Spring Boot 3 Configuration
# =============================================================

# -------------------------------------------------------------
# Application
# -------------------------------------------------------------
spring.application.name=food-delivery-backend
server.port=8080
server.servlet.context-path=/api

# -------------------------------------------------------------
# MySQL DataSource
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_db\
  ?useSSL=false\
  &serverTimezone=UTC\
  &allowPublicKeyRetrieval=true\
  &characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Toujar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP — default in Spring Boot 3)
spring.datasource.hikari.pool-name=FoodDeliveryPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# -------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# SQL Seed Data — 'never' since DB is already seeded
# -------------------------------------------------------------
spring.sql.init.mode=never

# -------------------------------------------------------------
# Redis — Spring Data Redis + Spring Cache
# -------------------------------------------------------------
# All connection details are externalised here.
# To move to Docker / WSL / cloud Redis, only change host + port.
# The application code (RedisConfig, service caches) never hardcodes these.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Tell Spring Boot to use Redis as the backing CacheManager.
# Without this line, @EnableCaching would default to ConcurrentMapCacheManager.
spring.cache.type=redis

# Default TTL for every cache entry unless overridden in RedisConfig.
# Format: ISO-8601 duration.  PT10M = 10 minutes.
spring.cache.redis.time-to-live=PT10M

# Serialize cache keys as readable strings (not byte arrays).
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=zwigato:

# -------------------------------------------------------------
# Email (Spring Mail) — password reset + OTP
# Use Gmail App Password or any SMTP provider.
# For Gmail: enable 2FA → generate App Password at myaccount.google.com/apppasswords
# -------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP settings
app.otp.expiry-minutes=10
app.otp.length=6

# Frontend base URL — used in reset-password email links
app.frontend.url=http://localhost:5173

# -------------------------------------------------------------
# JWT
# -------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# -------------------------------------------------------------
# Logging — clean console output
# -------------------------------------------------------------
# Your app code: INFO so you see startup + errors, not every method call
logging.level.com.fooddelivery=INFO

# Spring Security: WARN only — hides per-request "Securing POST /auth/login" noise
logging.level.org.springframework.security=WARN

# Hibernate SQL: OFF — show-sql=false already, this silences the SQL logger entirely
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# HikariCP: WARN — hides pool acquisition debug lines
logging.level.com.zaxxer.hikari=WARN

# Spring Web / MVC: WARN — hides handler mapping debug on every request
logging.level.org.springframework.web=WARN

# Root level stays at INFO — Spring Boot startup banner and key events still show
logging.level.root=INFO

# -------------------------------------------------------------
# Jackson
# -------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# -------------------------------------------------------------
# Springdoc / Swagger UI
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# -------------------------------------------------------------
# Active Profile
# -------------------------------------------------------------
spring.profiles.active=dev
