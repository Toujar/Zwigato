# =============================================================
# Food Delivery App — Production Profile
# =============================================================

# -------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------
# Never let Hibernate modify the production database schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
# Production: avoid unnecessary logs.
logging.level.root=INFO
logging.level.com.fooddelivery=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=WARN


# -------------------------------------------------------------
# Email
# -------------------------------------------------------------
# Never print SMTP/debug information in production.
spring.mail.properties.mail.debug=false


# -------------------------------------------------------------
# SQL Initialization
# -------------------------------------------------------------
# Production database is already created and populated.
spring.sql.init.mode=never


# -------------------------------------------------------------
# Jackson
# -------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null


# -------------------------------------------------------------
# SpringDoc / Swagger
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


