# =============================================================
#  Dev Profile Overrides
# =============================================================

# Schema: update so Hibernate keeps tables in sync with entities
spring.jpa.hibernate.ddl-auto=update

# SQL queries off — enable temporarily if you need to debug a query:
# spring.jpa.show-sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Your app logs at INFO in dev (bump to DEBUG if you need to trace a bug)
logging.level.com.fooddelivery=INFO
logging.level.org.springframework.security=WARN
